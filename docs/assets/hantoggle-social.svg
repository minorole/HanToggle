<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">HanToggle social preview</title>
  <desc id="description">HanToggle converts Simplified and Traditional Chinese on Mac with one hotkey.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3df"/>
      <stop offset="0.55" stop-color="#f4eadc"/>
      <stop offset="1" stop-color="#f8efdf"/>
    </linearGradient>
    <radialGradient id="cinnabarGlow" cx="0.15" cy="0.16" r="0.68">
      <stop offset="0" stop-color="#b33124" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b33124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jadeGlow" cx="0.92" cy="0.02" r="0.56">
      <stop offset="0" stop-color="#176858" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#176858" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M88 0H0V88" fill="none" stroke="#5b371a" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#372313" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#cinnabarGlow)"/>
  <rect width="1200" height="630" fill="url(#jadeGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g transform="translate(74 62)">
    <image href="hantoggle-app-icon.png" width="82" height="82"/>
    <text x="108" y="58" fill="#17110d" font-family="Songti SC, STSong, serif" font-size="44" font-weight="700">HanToggle</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="176" width="1056" height="314" rx="16" fill="#fffaf0" fill-opacity="0.84" stroke="#271a10" stroke-opacity="0.2"/>
    <rect x="92" y="196" width="1016" height="274" rx="10" fill="none" stroke="#b33124" stroke-opacity="0.18"/>
  </g>

  <g font-family="Songti SC, Songti TC, STSong, serif" font-weight="700" text-anchor="middle">
    <text x="326" y="402" fill="#17110d" font-size="194">汉</text>
    <circle cx="600" cy="333" r="54" fill="#b33124"/>
    <text x="600" y="350" fill="#fffdf7" font-size="42">⇄</text>
    <text x="874" y="402" fill="#7f2119" font-size="194">漢</text>
  </g>

  <text x="76" y="560" fill="#33251d" font-family="Songti SC, STSong, serif" font-size="31" font-weight="700">One hotkey. Simplified ⇄ Traditional.</text>
  <g transform="translate(828 524)" fill="#0f493e" font-family="Songti SC, STSong, serif" font-size="20" font-weight="700">
    <text x="0" y="36">macOS 13+</text>
    <circle cx="144" cy="29" r="3" fill="#b33124"/>
    <text x="162" y="36">Local</text>
    <circle cx="234" cy="29" r="3" fill="#b33124"/>
    <text x="252" y="36">Open source</text>
  </g>
</svg>
