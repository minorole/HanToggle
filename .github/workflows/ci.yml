name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Check public repository boundary
        run: Scripts/check-public-boundary.sh

      - name: Build
        run: swift build

      - name: Test
        run: swift test
